# Mount the lcm adapter into the active DSH profile.
# Default posture is SHADOW mode: compression decisions are computed and
# logged, but the model-facing result passes through unchanged.
- insert:
    - id: dsh-lcm
      name: dsh-lcm
      config:
        mode: active            # shadow | active
        maxInlineChars: 20000   # 与 core 压缩器 PASSTHROUGH_CHARS 对齐
        # —— 计量根（全局统一，事件带 project 字段；report/compare 跨项目聚合）——
        # 默认 ~/.lcm，可用 LCM_METER_ROOT 或此处 meterRoot 覆盖
        # —— 搭便车剪枝臂（piggyback pruning）——
        # 触发权交给 DSH 内置折叠 / 已观测到的击穿 / 继承会话首请求（subagent fork 必冷）：
        # 改写历史的代价（整段前缀全价重发）只在缓存本来要失效时支付。
        budgetTokens: 100000    # 守卫：会话总量超此值才值得动手（不是触发器）
        targetTokens: 60000     # 剪到此值以下停手（滞回带）
        pruneCooldownTokens: 10000 # 剪过一次后，会话需再长够此值才允许再次剪
        pruneProactive: false   # true=回到主动预算触发（默认关：实测净负 3.2%）
        bustThresholdTokens: 50000 # fresh 超过此值视为「前缀已冷」
        pruneMinChars: 4000     # 候选下限：摘要本身 ~1k 字符，太小的剪了没收益
        # —— 记忆臂（Phase 3：本地 ~/.lcm/memories + OpenViking 双写同步）——
        memoryExtract: true       # compaction/summary → 确定性提取入库（搭 DSH 内置摘要便车，零 LLM）
        memoryInjectMode: shadow  # shadow 只记账；active 在请求尾部追加检索块（复核 shadow 期数据后切）
        memoryInjectMaxEntries: 6 # 注入块条目上限（注入自身不能成为体积源）
        # —— 静态层裁剪臂（工具定义在请求最前端 → 会话中途改动会击穿前缀缓存，
        #    因此只做会话无关的确定性裁剪：同输入必得逐字节同输出）——
        # 2026-09-15 人工复核 trim-diff 后切 active（29/73 条被裁，省 54% 描述字符 ≈ 3.7k tok/请求）。
        # 已知代价：MCP 工具（mcp__openviking 等）描述后段的参数文档会被首段优先规则裁掉——用户拍板接受。
        staticTrimMode: active
        toolMaxDescriptionChars: 300 # 0=关；300 实测省 54% 描述字符
        dropToolFamilies: []         # 例：["mcp__openviking","mcp__dbx"]（整族不注入）
